# 배치 경로: monitoring/prometheus/prometheus.yml

global:
    scrape_interval: 15s
    scrape_timeout: 10s

scrape_configs:
    # 로컬 앱(IDE/gradle, :8080) 스크랩
    - job_name: 'snaptix-local'
      metrics_path: /actuator/prometheus
      static_configs:
          - targets: ['host.docker.internal:8080']
            labels:
                instance: 'local-app'

    # ─────────────────────────────────────────────────────────────
