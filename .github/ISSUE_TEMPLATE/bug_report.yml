name: 🐛 버그 리포트
description: 예상과 다르게 동작하는 버그를 신고합니다
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        버그를 발견해 주셔서 감사합니다! 아래 항목을 최대한 자세히 작성해주세요.

  - type: textarea
    id: description
    attributes:
      label: 📋 버그 설명
      description: 어떤 문제가 발생했는지 간략히 설명해주세요.
      placeholder: "예: 좌석 예약 API 호출 시 500 에러가 발생합니다."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 🔁 재현 방법
      description: 버그를 재현할 수 있는 단계를 작성해주세요.
      placeholder: |
        1. POST /api/reservations 호출
        2. 동일한 좌석 ID로 2회 연속 요청
        3. 두 번째 요청에서 500 응답 확인
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: ✅ 기대 동작
      placeholder: "예: 두 번째 요청은 409 Conflict를 반환해야 합니다."
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: ❌ 실제 동작
      placeholder: "예: 500 Internal Server Error가 반환됩니다."
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 📎 스택 트레이스 / 로그
      description: 관련 에러 로그나 스택 트레이스를 붙여넣어 주세요.
      render: text

  - type: dropdown
    id: severity
    attributes:
      label: 🚨 심각도
      options:
        - Critical (서비스 불가)
        - High (핵심 기능 오동작)
        - Medium (일부 기능 오동작)
        - Low (UX 불편)
    validations:
      required: true

  - type: input
    id: branch
    attributes:
      label: 🌿 발생 브랜치
      placeholder: "예: develop, feature/minji/waiting-queue"
