name: deploy

on:
  push:
    branches: [ci/pping/cicd-blue-green-deploy]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

# AWS_REGION은 secrets라 최상위 env에서 못 읽음 → job 레벨 env로 주입(아래).
env:
  TEAM_TAG: devcos-team01
  ECR_REPO: team01-app
  HEALTH_PATH: /actuator/health

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}   # GitHub Secret에서 주입(job 레벨은 secrets 접근 가능)

    steps:
      - uses: actions/checkout@v4

      - name: Inject application-secret.yml
        env:
          APPLICATION_SECRET: ${{ secrets.APPLICATION_SECRET }}
        run: |
          mkdir -p src/main/resources
          printf '%s' "${APPLICATION_SECRET:-}" > src/main/resources/application-secret.yml
          echo "application-secret.yml 생성됨 ($(wc -c < src/main/resources/application-secret.yml) bytes)"

      - name: Configure AWS credentials (Access Key)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      # ECR 로그인
      - name: ECR login
        id: ecr
        run: |
          set -euo pipefail
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$REGISTRY"
          echo "registry=$REGISTRY" >> "$GITHUB_OUTPUT"
          echo "image=$REGISTRY/$ECR_REPO" >> "$GITHUB_OUTPUT"

      # 이미지 빌드 & push (:latest + :<sha>)
      - name: Build & push image
        id: img
        run: |
          set -euo pipefail
          IMAGE="${{ steps.ecr.outputs.image }}"
          TAG="${GITHUB_SHA::12}"
          docker build -t "$IMAGE:$TAG" -t "$IMAGE:latest" .
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"
          echo "ref=$IMAGE:$TAG" >> "$GITHUB_OUTPUT"

      # 온디맨드라 ID가 매번 바뀜 → 태그로 인스턴스 발견
      - name: Resolve instance IDs
        id: ids
        run: |
          set -euo pipefail
          find_id() {
            aws ec2 describe-instances \
              --filters "Name=tag:Team,Values=${TEAM_TAG}" \
                        "Name=tag:AppRole,Values=$1" \
                        "Name=instance-state-name,Values=running" \
              --query "Reservations[].Instances[].InstanceId | [0]" --output text
          }
          APP_ID="$(find_id app)";  EDGE_ID="$(find_id edge)"
          test "$APP_ID" != "None" -a -n "$APP_ID"   || { echo "app 인스턴스 없음 (apply 안 됨?)"; exit 1; }
          test "$EDGE_ID" != "None" -a -n "$EDGE_ID" || { echo "edge 인스턴스 없음"; exit 1; }
          echo "app=$APP_ID" >> "$GITHUB_OUTPUT"
          echo "edge=$EDGE_ID" >> "$GITHUB_OUTPUT"
          echo "APP=$APP_ID EDGE=$EDGE_ID"

      # SSM(app): idle 컬러 판별 → pull → 기동 → 헬스체크. idle 컬러를 출력으로 회수.
      - name: Deploy idle color on app instance
        id: deploy
        run: |
          set -euo pipefail
          IMAGE_REF="${{ steps.img.outputs.ref }}"
          REGISTRY="${{ steps.ecr.outputs.registry }}"
          read -r -d '' SCRIPT <<EOF || true
          set -euo pipefail
          REGION="${AWS_REGION}"; HEALTH="${HEALTH_PATH}"
          IMAGE="${IMAGE_REF}"; REGISTRY="${REGISTRY}"
          aws ecr get-login-password --region "\$REGION" | docker login --username AWS --password-stdin "\$REGISTRY"
          docker pull "\$IMAGE"
          # 현재 live 컨테이너 추정: app1_1(8080)이 떠 있으면 live=blue → idle=green(8081), 아니면 반대
          if docker ps --format '{{.Names}}' | grep -q '^app1_1\$'; then
            IDLE_NAME=app1_2; IDLE_PORT=8081; IDLE_COLOR=green
          else
            IDLE_NAME=app1_1; IDLE_PORT=8080; IDLE_COLOR=blue
          fi
          docker rm -f "\$IDLE_NAME" 2>/dev/null || true
          # --env-file: app_userdata가 만든 DB/Redis 접속정보(app.env) 주입. 없으면 앱이 DB 연결 실패.
          docker run -d --name "\$IDLE_NAME" --restart unless-stopped --network common \
            --env-file /dockerProjects/app.env \
            -p "\$IDLE_PORT:8080" -e SERVER_PORT=8080 "\$IMAGE"
          # 헬스체크(최대 ~90s)
          for i in \$(seq 1 30); do
            if curl -fsS "http://127.0.0.1:\$IDLE_PORT\$HEALTH" >/dev/null 2>&1; then
              echo "IDLE_COLOR=\$IDLE_COLOR"; echo "IDLE_PORT=\$IDLE_PORT"; exit 0
            fi
            sleep 3
          done
          echo "health check failed on \$IDLE_PORT"; exit 1
          EOF
          # 스크립트에 따옴표·쉼표·줄바꿈이 있어 shorthand(commands=...)는 파싱 실패함.
          # jq로 올바르게 이스케이프한 JSON 파일을 만들어 --parameters file:// 로 전달.
          printf '%s' "$SCRIPT" > /tmp/ssm_deploy.sh
          jq -n --rawfile c /tmp/ssm_deploy.sh '{commands:[$c]}' > /tmp/ssm_deploy.json
          CMD_ID="$(aws ssm send-command \
            --instance-ids "${{ steps.ids.outputs.app }}" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${IMAGE_REF}" \
            --parameters file:///tmp/ssm_deploy.json \
            --query Command.CommandId --output text)"
          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "${{ steps.ids.outputs.app }}" || true
          OUT="$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "${{ steps.ids.outputs.app }}")"
          echo "$OUT" | python3 -c 'import sys,json;d=json.load(sys.stdin);print(d["StandardOutputContent"]);print("STATUS",d["Status"]);sys.exit(0 if d["Status"]=="Success" else 1)'
          IDLE_COLOR="$(echo "$OUT" | python3 -c 'import sys,json,re;print(re.search(r"IDLE_COLOR=(\w+)",json.load(sys.stdin)["StandardOutputContent"]).group(1))')"
          echo "color=$IDLE_COLOR" >> "$GITHUB_OUTPUT"

      # SSM(edge): HAProxy weight 전환 (idle→100, live→0). admin socket을 socat으로 제어.
      - name: Switch traffic on edge (HAProxy weight)
        run: |
          set -euo pipefail
          COLOR="${{ steps.deploy.outputs.color }}"   # 새로 띄운 쪽
          read -r -d '' SCRIPT <<EOF || true
          set -euo pipefail
          ADMIN="tcp:127.0.0.1:9999"   # HAProxy runtime API(TCP, 호스트 loopback에만 노출)
          command -v socat >/dev/null || (sudo dnf install -y socat || sudo yum install -y socat)
          if [ "${COLOR}" = "green" ]; then NEWUP=green; OLD=blue; else NEWUP=blue; OLD=green; fi
          echo "set weight app_back/\$NEWUP 100" | socat - "\$ADMIN"
          echo "set weight app_back/\$OLD 0"     | socat - "\$ADMIN"
          echo "switched: \$NEWUP=100 \$OLD=0"
          echo "show stat" | socat - "\$ADMIN" | grep app_back || true
          EOF
          printf '%s' "$SCRIPT" > /tmp/ssm_switch.sh
          jq -n --rawfile c /tmp/ssm_switch.sh '{commands:[$c]}' > /tmp/ssm_switch.json
          CMD_ID="$(aws ssm send-command \
            --instance-ids "${{ steps.ids.outputs.edge }}" \
            --document-name AWS-RunShellScript \
            --parameters file:///tmp/ssm_switch.json \
            --query Command.CommandId --output text)"
          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "${{ steps.ids.outputs.edge }}" || true
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "${{ steps.ids.outputs.edge }}" \
            --query '{status:Status,out:StandardOutputContent,err:StandardErrorContent}' --output json

      # 구 컬러 컨테이너 정리 — 즉시 롤백 여지를 두려면 이 스텝을 생략/지연
      - name: Stop old color on app instance
        if: success()
        run: |
          set -euo pipefail
          COLOR="${{ steps.deploy.outputs.color }}"
          read -r -d '' SCRIPT <<EOF || true
          set -euo pipefail
          # 새로 올린 게 green이면 구버전은 blue(app1_1), 반대면 app1_2
          if [ "${COLOR}" = "green" ]; then OLDNAME=app1_1; else OLDNAME=app1_2; fi
          docker stop "\$OLDNAME" 2>/dev/null || true
          echo "stopped \$OLDNAME"
          EOF
          printf '%s' "$SCRIPT" > /tmp/ssm_stop.sh
          jq -n --rawfile c /tmp/ssm_stop.sh '{commands:[$c]}' > /tmp/ssm_stop.json
          CMD_ID="$(aws ssm send-command \
            --instance-ids "${{ steps.ids.outputs.app }}" \
            --document-name AWS-RunShellScript \
            --parameters file:///tmp/ssm_stop.json \
            --query Command.CommandId --output text)"
          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "${{ steps.ids.outputs.app }}" || true
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "${{ steps.ids.outputs.app }}" \
            --query 'Status' --output text