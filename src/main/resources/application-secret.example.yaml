jwt:
  secret: ${JWT_SECRET:replace-this-with-local-development-secret-at-least-32bytes}
  access-token-expiration-seconds: 600
  refresh-token-expiration-seconds: 604800

alert:
  slack:
    enabled: false
    webhook-url: ${SLACK_WEBHOOK_URL:}
    channel: ${SLACK_CHANNEL:#ticketing-redis-alerts}
    mention-on-critical: false

payment:
  mock:
    webhook:
      secret: ${MOCK_PAYMENT_WEBHOOK_SECRET:replace-this-with-mock-payment-webhook-secret}
