spring:
  application:
    name: snaptix

  datasource:
    url: jdbc:mysql://localhost:3306/snaptix?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: snaptix
    password: snaptix1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  exposed:
    generate-ddl: true

  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:snaptix-local-jwt-secret-key-for-development-only-32bytes}
  access-token-expiration-seconds: 600
  refresh-token-expiration-seconds: 604800
