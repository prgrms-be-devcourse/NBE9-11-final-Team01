spring:
  application:
    name: snaptix

  profiles:
    active: dev
    include: secret

  datasource:
    url: jdbc:mysql://localhost:3306/snaptix?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul&rewriteBatchedStatements=true
    username: ${SPRING_DATASOURCE_USERNAME:snaptix}
    password: ${SPRING_DATASOURCE_PASSWORD:snaptix1234}
    driver-class-name: com.mysql.cj.jdbc.Driver

  exposed:
    generate-ddl: true

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html

resilience4j:
  circuitbreaker:
    instances:
      redis:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        failure-rate-threshold: 50
        slow-call-duration-threshold: 2s
        slow-call-rate-threshold: 80
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        record-failure-predicate: com.develop.snaptix.global.aop.aspect.RedisExceptionPredicate
        ignore-exceptions:
          - com.develop.snaptix.global.exception.BusinessException

alert:
  slack:
    enabled: false
    webhook-url: ${SLACK_WEBHOOK_URL:}
    channel: ${SLACK_CHANNEL:#ticketing-redis-alerts}
    mention-on-critical: false
  throttle:
    window-seconds: 300

# Rebuild & Reconcile (Epic 13)
reconcile:
  hold-window: 5m          # 유효 점유 홀드 윈도우 (cutoff = now - holdWindow)
  scheduler-cron: "0 */10 * * * *"   # 만료 정산 10분 주기 (Story 13.3-2차)
  drift-cron: "0 */30 * * * *"       # 상시 드리프트 정산 30분 주기 (Story 13.4)
  rebuild-lock-ttl: 5m     # 다중 인스턴스 단일 재구축 락 TTL

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

custom:
  dev:
    domain: localhost
    backUrl: "http://${custom.dev.domain}:${server.port}"
    frontUrl: "http://${custom.dev.domain}:3000"
  prod:
    domain: edge.example-test-domain11.shop
    backUrl: "https://${custom.prod.domain}"
    frontUrl: "https://<프런트-호스팅-주소>"     # CORS 허용 origin
  site:                                          # 기본 dev, prod 프로파일에서 override
    domain: "${custom.dev.domain}"
    backUrl: "${custom.dev.backUrl}"
    frontUrl: "${custom.dev.frontUrl}"
    
realtime:
  sse:
    timeout: 8m
    heartbeat-interval: 30s

snaptix:
  redis:
    ttl:
      ingest-envelope: 8m       # 멱등/소유권 봉투(권장 8분, 부하테스트로 조정)
      order-hold: 5m            # ORDER_HOLD = 워커 재앵커링 기준
      webhook-processed: 10m
      payment-approve: 60s
      event-info: 1h            # Story 1.1 / 11.2 / 13.2 일치
      order-pending: 2m
      rate-limit-second: 1s
      rate-limit-minute: 60s
